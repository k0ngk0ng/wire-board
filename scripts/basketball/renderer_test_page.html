<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Basketball renderer verification</title><style>body{margin:16px;background:#172024;color:#fff;font:14px sans-serif}canvas{display:block;width:min(768px,100%);height:auto;image-rendering:pixelated}p{max-width:768px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Renderer verification fixture</h1><p>Original semantic draw inputs. This is not a playable Go reconstruction.</p><canvas id="game" width="256" height="240" aria-label="Original art renderer test"></canvas><pre id="status">Loading verification…</pre><script type="module">window.rendererAcceptance=import('/acceptance.mjs').then(m=>m.run()).catch(error=>({status:'failed',error:String(error)}));window.rendererAcceptance.then(r=>{window.rendererResult=r;document.querySelector('#status').textContent=JSON.stringify(r,null,2)});</script></html>
