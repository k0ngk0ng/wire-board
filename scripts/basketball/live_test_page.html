<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>热血篮球 · Go 运行验证</title>
<link rel="stylesheet" href="/live.css"><style>
*{box-sizing:border-box}body{margin:0;background:#172126;color:#f5f3e9;font:16px system-ui,sans-serif}main{max-width:980px;margin:auto;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:20px;margin:0}p{margin:0;font-size:13px;color:#cdd5d7}button{font:inherit;color:#182126;background:#e7ddc5;border:1px solid #b9ab8d;border-radius:8px;min-width:46px;min-height:44px;padding:8px 14px}button:disabled{color:#3c4548;background:#c2c8c7}#game{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;outline:none}#game:focus-visible{outline:2px solid #d4b379}canvas{width:min(100%,calc((100dvh - 235px)*256/240),768px);height:auto;aspect-ratio:256/240;image-rendering:pixelated;background:#000;border:2px solid #99886a}#controls{display:flex;align-items:center;justify-content:space-between;width:min(100%,620px);gap:12px}.directions{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,44px);gap:4px}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.actions{display:grid;grid-template-columns:repeat(2,48px);gap:6px}.actions button{padding:6px 2px;white-space:nowrap}#status{min-height:20px}#error{color:#ffcdc1;white-space:pre-wrap;max-width:100%;overflow-wrap:anywhere;font-size:13px}@media(max-width:480px){main{padding:8px;gap:6px}h1{font-size:17px}p{font-size:12px}canvas{width:min(100%,calc((100dvh - 190px)*256/240))}button{padding:6px}header button{min-width:74px}}

/* This host is a development acceptance page; the shared pad owns its skin. */
main{height:100dvh;gap:6px}#game{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;justify-items:center;gap:8px}.court-fit{width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size}canvas{width:min(100cqw,calc(100cqh * 256 / 240));height:auto;max-width:100%;max-height:100%;aspect-ratio:256/240}#controls{display:block;width:min(100%,520px)}#error:empty{display:none}header{flex-shrink:0}#status{flex-shrink:0;text-align:center}
</style></head><body><main><header><div><h1>热血篮球</h1><p>Go 运行验证 · 纽约场地</p></div><button id="start">开始比赛</button></header><div id="game" tabindex="0" aria-label="热血篮球操作区"><div class="court-fit"><canvas width="256" height="240" aria-label="热血篮球球场"></canvas></div><div id="controls"></div></div><p id="status">支持键盘与触摸，键位可在控制器设置中修改</p><p id="error" role="alert"></p></main><script type="module" src="/live.js"></script></body></html>
