<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DotA · 兵线争锋 — 规则验证样板</title>
<style>
:root{color-scheme:dark;--ink:#eee7d2;--muted:#b4b6a8;--gold:#e0bd67;--green:#72dca6;--red:#f69588;--line:#4c4b35;--panel:#202924}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#243c31,#101a17 72%);color:var(--ink);font-family:system-ui,"Microsoft YaHei",sans-serif;font-size:15px;line-height:1.55}button,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #807042;background:linear-gradient(#3d4638,#26302b);border-radius:6px;padding:9px 15px;font-weight:650}button:hover:not(:disabled){border-color:var(--gold);background:#465443}button:disabled{cursor:default;border-color:#435047;color:#b0b3a6}button.primary{background:linear-gradient(#836d31,#4c421e);border-color:var(--gold);color:#fff3ce}button.small{padding:5px 11px;font-size:13px}select{border:1px solid #786845;background:#18251f;border-radius:6px;padding:10px;max-width:100%}header{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1300px;margin:auto;padding:20px 22px 12px}.brand{font:700 26px Georgia,serif;letter-spacing:2px;color:var(--gold)}.brand span{font:600 16px system-ui;letter-spacing:3px;color:var(--ink);margin-left:10px}.sub{color:var(--muted);font-size:12px;margin-top:4px}.nav{display:flex;gap:8px;flex-wrap:wrap}main{max-width:1300px;margin:auto;padding:8px 22px 28px}.notice{border-left:3px solid var(--gold);padding:8px 12px;background:#273028;color:#d6d6c0;font-size:13px;margin-bottom:14px}.panel{background:linear-gradient(120deg,#263029,#1c2722);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 8px 20px #0002}h1,h2,h3,p{margin:0 0 12px}h1{font-size:23px}h2{font-size:18px;color:var(--gold)}h3{font-size:15px}.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.spread{justify-content:space-between}.grid{display:grid;gap:12px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.seat{border:1px solid #52604b;border-radius:7px;padding:14px;display:flex;align-items:center;gap:12px}.seat b{flex:1}.bot{color:var(--muted);font-size:12px}.phase-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.mode{display:flex;gap:12px;margin:20px 0}.mode button{padding:22px 28px}.mode strong{display:block;font-size:23px;color:var(--gold)}.mode small{font-size:12px;color:var(--muted)}.draft{grid-template-columns:repeat(4,1fr)}.draft button{display:flex;align-items:center;gap:12px;text-align:left;padding:16px}.portrait{width:52px;height:52px;border:2px solid #a68a4a;border-radius:4px;flex-shrink:0}.draft .portrait{width:64px;height:64px}.team-head{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:8px}.team0{color:var(--green)}.team1{color:var(--red)}.player{display:grid;grid-template-columns:52px 1fr;gap:10px;border:1px solid #596246;border-radius:7px;padding:10px;background:#14231acc}.player.mine{border:2px solid var(--gold);padding:9px}.player strong{font-size:14px}.player .info{font-size:12px;color:var(--muted)}.hp{color:#ffc98d;font-weight:bold}.gear{display:flex;gap:4px;margin-top:5px}.gear img{width:24px;height:24px;border:1px solid #84703c}.battle{display:grid;grid-template-columns:1fr 260px;gap:14px;margin-top:14px}.map{padding:12px;background:radial-gradient(ellipse at center,#294734,#192d24);border:1px solid #586247;border-radius:9px}.map-title{display:flex;justify-content:space-between;gap:12px;padding:0 5px 9px;font-size:13px}.lane{display:grid;grid-template-columns:64px 1fr 64px;gap:12px;align-items:center;padding:14px 10px;margin-top:8px;border:1px solid #8c846c44;border-radius:7px;background:linear-gradient(95deg,#2d594744,#56583a66,#5e322f55)}.tower{text-align:center;font-size:12px;color:var(--muted)}.tower b{font-size:22px;display:block;color:var(--ink);letter-spacing:1px}.lane-name{text-align:center;font-size:13px;margin-bottom:9px;color:#e3dabf}.track{display:grid;grid-template-columns:repeat(5,1fr);position:relative;gap:8px}.track:before{content:"";position:absolute;left:5%;right:5%;top:50%;height:3px;background:#88927466}.spot{height:25px;border:1px solid #81816d;border-radius:4px;background:#26372e;z-index:1;text-align:center;line-height:23px;font-size:11px;color:var(--muted)}.spot.active{background:var(--gold);color:#241b0b;box-shadow:0 0 9px #e0bd673d;font-weight:bold}.occupants{display:flex;gap:4px;min-height:31px;margin-top:10px;justify-content:center}.occupants img{width:28px;height:28px;border-radius:3px;border:2px solid}.log{padding:13px;max-height:330px;overflow:auto;font-size:12px;color:#c8cebc}.log p{padding-bottom:9px;border-bottom:1px solid #56624755;margin-bottom:9px}.log strong{color:var(--gold)}.controls{margin-top:14px}.cards{grid-template-columns:repeat(8,1fr);gap:8px}.card{padding:10px 5px;min-height:134px;display:flex;align-items:center;flex-direction:column;gap:6px;position:relative}.card img{width:43px;height:43px;border:1px solid #a58c56;border-radius:3px}.card strong{font-size:13px}.card small{font-size:11px;color:var(--muted)}.card.selected{outline:2px solid var(--gold);background:#5b542e;box-shadow:0 0 12px #e0bd671c}.details{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:13px}.details .text{flex:1;font-size:13px;min-width:170px}.details select{max-width:270px}.summary{color:#fff0a7;border-color:var(--gold);margin:14px 0}.gallery-row{display:grid;grid-template-columns:160px repeat(5,1fr);align-items:center;gap:10px;margin:9px 0;padding:12px;border:1px solid var(--line);border-radius:7px}.gallery-item{display:flex;align-items:center;gap:9px;font-size:13px}.gallery-item img{width:52px;height:52px;flex-shrink:0}.item-grid{grid-template-columns:repeat(4,1fr)}.error{color:#ffd2c4;background:#6a302b;padding:10px 15px;border-radius:6px;margin-bottom:12px}.help{font-size:13px;line-height:1.8}.help li{margin:7px 0}.help a{color:#e0bd67}footer{color:var(--muted);font-size:12px;margin-top:16px}.hidden{display:none!important}
@media(max-width:900px){.battle{grid-template-columns:1fr}.log{max-height:150px}.cards{grid-template-columns:repeat(4,1fr)}.draft{grid-template-columns:repeat(2,1fr)}.gallery-row{grid-template-columns:repeat(5,1fr)}.gallery-row>b{grid-column:1/-1}.item-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){body{font-size:14px}header{padding:13px 12px 5px;align-items:flex-start;flex-direction:column;gap:10px}.brand{font-size:23px}.brand span{font-size:15px}main{padding:8px 12px 20px}.panel{padding:12px}.two{gap:8px}.three{grid-template-columns:1fr}.players{grid-template-columns:1fr}.player{padding:7px}.player.mine{padding:6px}.player strong{font-size:12px}.player .info{font-size:11px}.phase-title{align-items:flex-start}.mode{gap:7px}.mode button{padding:16px 14px;flex:1}.mode strong{font-size:20px}.draft button{padding:10px;gap:7px;font-size:12px}.draft .portrait{width:44px;height:44px}.battle{margin-top:10px;gap:10px}.lane{grid-template-columns:42px 1fr 42px;gap:7px;padding:10px 4px}.tower b{font-size:18px}.map{padding:8px}.track{gap:5px}.spot{height:23px;font-size:10px;line-height:21px}.cards{gap:6px}.card{min-height:112px;padding:8px 3px;gap:4px}.card img{width:38px;height:38px}.card strong{font-size:11px}.card small{font-size:10px}.details{flex-wrap:wrap}.details .text{flex-basis:100%}.details select{flex:1;min-width:0}.details button{padding:10px}.item-grid{grid-template-columns:repeat(2,1fr)}.gallery-row{gap:7px;padding:10px}.gallery-row img{width:100%;max-width:52px}.seat{padding:10px;gap:5px}.nav button{font-size:12px}.team-head{font-size:13px}.map-title{font-size:12px}.notice{font-size:12px}}
</style></head><body>
<header><div><div class="brand">DotA<span>兵线争锋</span></div><div class="sub">经典魔兽 · 同时选牌 · 队伍对抗</div></div><nav class="nav"><button data-tab="play">规则试玩</button><button data-tab="assets">原版素材</button><button data-tab="rules">玩法说明</button></nav></header>
<main><div class="notice">本地规则验证样板 · 使用 DOTA1 原版图标；数值与技能为桌游改编，尚未接入正式大厅。</div><div id="error" class="error hidden" role="alert"></div><div id="content"></div><footer>素材来源：iCCup 经典 DotA 资料库。8 名英雄、32 个技能、17 件装备均保留下载来源及校验值。</footer></main>
<script>
let room=null, manifest=null, tab='play', card=0, busy=false;
const $=s=>document.querySelector(s), names=['推进','突袭','固守','打钱','整备'], commonArt=['boots','blades_attack','wand','quelling_blade','arcane_boots'];
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const image=(id,cls='',alt='')=>`<img class="${cls}" src="${manifest.assets.find(x=>x.id===id).file}" alt="${esc(alt)}">`;
const laneName=(i,n)=>i<0?'泉水':n===1?'中路':n===2?['上路','下路'][i]:['上路','中路','下路'][i];
const teamName=t=>t===0?'近卫':'天灾';
async function api(action,data={}){if(busy)return;busy=true;$('#error').textContent='';$('#error').classList.add('hidden');try{const res=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,id:room?.id,...data})});const next=await res.json();if(!res.ok)throw new Error(next.error);room=next;card=room.legal?.[0]?.card??0;render();}catch(e){$('#error').textContent=e.message;$('#error').classList.remove('hidden');}finally{busy=false;}}
function stats(h){return `<span class="hp">♥ ${h.hp}</span> · 金 ${h.gold} · 大招 ${h.charge}/3`;}
function actor(p){const h=room.game.heroes[p];return `${room.names[h.kind]}${p===room.player?'（你）':''}`;}
function render(){
const host=$('#content');
if(tab==='assets'){host.innerHTML=`<section class="panel"><h1>熟悉的老 DotA</h1><p class="muted">以下全部为已下载的原始文件，按约 52 像素展示。卡框与棋盘另行设计，不把小图硬拉成整张大卡。</p>${Object.entries(room?.names||{axe:'斧王',crystal_maiden:'冰女',earthshaker:'撼地神牛',sven:'流浪剑客',juggernaut:'剑圣',drow:'黑暗游侠',lina:'秀逗魔导士',sniper:'矮人狙击手'}).map(([k,n])=>`<div class="gallery-row"><b>${n}</b>${['portrait','skill_1','skill_2','skill_3','skill_4'].map(s=>image(k+'_'+s,'',n+' '+s)).join('')}</div>`).join('')}<h2 style="margin-top:24px">17 件装备</h2><div class="grid item-grid">${manifest.assets.filter(a=>a.group==='item').map(a=>`<div class="gallery-item">${image(a.id,'',a.name)}<span>${a.name}</span></div>`).join('')}</div></section>`;return;}
if(tab==='rules'){host.innerHTML=`<section class="panel help"><h1>能摆在桌面上玩的规则</h1><p>每人一名英雄、8 张行动牌、金币和大招标记。所有伤害与推进都可用纸笔结算。三种人数都必须摧毁对方遗迹获胜。</p><ol><li><b>先入座，再分队：</b>开始之后才分近卫／天灾，确认后选英雄。1v1 开中路，2v2 开双路，3v3 开三路。</li><li><b>同时选一张牌：</b>自己的牌先暗扣，双方全员确定后揭开；队友可以沟通，敌方与观战者看不到计划。</li><li><b>先移动与防护，再交替执行攻击：</b>固守能挡突袭；突袭造成实际伤害就能中断推进；推进可以压过固守。攻击按公开先手交替结算，先被击倒的英雄无法再发动伤害；先手每轮换边。回城在承受攻击之后结算，不能无条件逃过致命一击。</li><li><b>比较每条路的推进：</b>净优势 1–2 点走一格，3 点以上走两格。兵线抵达敌方端点，打塔 1 点，塔倒后伤害遗迹；然后兵线回中点。</li><li><b>资源与手牌：</b>出过的行动牌暂不可再用；整备回泉水、收回手牌，可买一件装备。偶数轮每人得 1 金，打钱额外得 3 金。大招需 3 点蓄力，每轮恢复 1 点。</li><li><b>两格装备：</b>速度之靴可补差价升级相位鞋／秘法鞋。其他装备直接购买；满格时换掉最早装备，保留出装取舍。1v1 不提供需要多路／队友的推推棒、跳刀和梅肯。</li><li><b>胜负与节奏：</b>全部模式都要拆毁遗迹；第 13 轮起攻城伤害为 2，第 21 轮起为 3。不会按比分提前结束。双方同轮拆家时，由本轮公开的先手标记决定，该标记随机起始，每轮换边。</li><li><b>阵亡可继续：</b>损失 2 金并回泉水，对方在该路获得 3 点援军推进；下轮必须重新进军，没有提前淘汰的玩家。</li></ol><p class="muted">样板中你控制一名英雄，其他位置由电脑补齐。完整规则及验证边界见同目录 RULES.md / REPORT.md。</p></section>`;return;}
if(!room){host.innerHTML=`<section class="panel"><h1>选择一场桌上对决</h1><p class="muted">先建立普通房间。点击开始后再分队。</p><div class="mode">${[1,2,3].map(n=>`<button data-new="${n}"><strong>${n} v ${n}</strong><small>${n*2} 个席位 · 电脑可补位</small></button>`).join('')}</div><p>用推进压过固守，用突袭阻止推进，用技能与装备打破僵局。</p></section>`;return;}
if(room.phase==='waiting'){host.innerHTML=`<section class="panel"><div class="phase-title"><h1>房间 · 等待开始</h1><span class="muted">${room.n*2} / ${room.n*2} 已准备</span></div><div class="grid two">${room.seats.map((s,i)=>`<div class="seat"><span>${i+1}</span><b>${s.name}</b><span class="bot">${s.bot?'🤖 电脑':'✓ 已准备'}</span></div>`).join('')}</div><div class="row" style="margin-top:20px"><button class="primary" id="start">开始 · 进入分队</button><button id="reset">换个模式</button></div></section>`;return;}
if(room.phase==='teams'){host.innerHTML=`<section class="panel"><h1>分队</h1><p class="muted">每队 ${room.n} 人。可以调整，再确认进入选英雄。</p><div class="grid two">${room.seats.map((s,i)=>`<label class="seat"><b>${s.name}${s.bot?' 🤖':''}</b><select aria-label="${s.name}的队伍" data-team="${i}"><option value="0" ${room.teams[i]===0?'selected':''}>近卫</option><option value="1" ${room.teams[i]===1?'selected':''}>天灾</option></select></label>`).join('')}</div><button class="primary" id="teams" style="margin-top:20px">确认队伍 · 选择英雄</button></section>`;return;}
if(room.phase==='heroes'){host.innerHTML=`<section class="panel"><h1>选择你的英雄</h1><p class="muted">你属于${teamName(room.teams[0])}。其余英雄由电脑从剩余英雄中选择，不重复。</p><div class="grid draft">${Object.entries(room.names).map(([k,n])=>`<button data-hero="${k}">${image(k+'_portrait','portrait',n)}<span>${n}</span></button>`).join('')}</div></section>`;return;}
const g=room.game,n=room.n,mine=g.heroes[room.player];
let body=`<div class="phase-title"><h1>第 ${room.finished?g.round-1:g.round} 轮${room.finished?' · 对局结束':''}</h1><div class="row"><span class="muted">抢先：${teamName((g.first+g.round-1)%2)}</span><button class="small" id="reset">新牌局</button></div></div>`;
if(room.finished)body+=`<div class="panel summary"><h2>${teamName(room.winner)}获胜 · ${room.winner===mine.team?'你们赢了':'下次再战'}</h2><p>${'遗迹已被摧毁。'}</p></div>`;
body+=`<div class="grid two">${[0,1].map(t=>`<section><div class="team-head team${t}"><span>${teamName(t)}${mine.team===t?' · 你的队伍':''}</span><span>遗迹 ${g.core[t]} · 击杀 ${g.kills[t]}</span></div><div class="grid players ${n===3?'three':''}">${g.heroes.map((h,p)=>h.team!==t?'':`<div class="player ${p===room.player?'mine':''}">${image(h.kind+'_portrait','portrait',room.names[h.kind])}<div><strong>${actor(p)} ${p===room.player?'':'🤖'}</strong><div class="info">${stats(h)}<br>${laneName(h.lane,n)}</div><div class="gear">${h.gear.map(k=>image(k,'',manifest.assets.find(a=>a.id===k).name)).join('')}</div></div></div>`).join('')}</div></section>`).join('')}</div>`;
body+=`<div class="battle"><section class="map"><div class="map-title"><b>兵线战场</b><span>打中即可中断推进 · ${g.round>=21?'攻城伤害 3':g.round>=13?'攻城伤害 2':'攻城伤害 1'}</span></div>${Array.from({length:n},(_,l)=>`<div class="lane"><div class="tower team0">近卫塔<b>${g.towers[0][l]||'—'}</b></div><div><div class="lane-name">${laneName(l,n)}</div><div class="track">${[-2,-1,0,1,2].map(x=>`<div class="spot ${g.track[l]===x?'active':''}">${g.track[l]===x?'兵线':x===0?'河道':'·'}</div>`).join('')}</div><div class="occupants">${g.heroes.map((h,p)=>h.lane===l?`<img src="${manifest.assets.find(a=>a.id===h.kind+'_portrait').file}" style="border-color:${h.team===0?'var(--green)':'var(--red)'}" alt="${actor(p)}在${laneName(l,n)}">`:'').join('')}</div></div><div class="tower team1">天灾塔<b>${g.towers[1][l]||'—'}</b></div></div>`).join('')}</section><aside class="panel log"><h2>战报</h2>${room.history.length?room.history.slice().reverse().map(h=>`<p><strong>第 ${h.round} 轮</strong><br>${h.cards.map((c,p)=>`${actor(p)}：${c<5?names[c]:room.skills[g.heroes[p].kind][c-5][0]}`).join('<br>')}<br><span class="team0">遗迹 ${h.core[0]}</span> / <span class="team1">${h.core[1]}</span></p>`).join(''):'同时计划，公开结算。队伍配合可以打破单张卡的克制关系。'}</aside></div>`;
if(!room.finished){body+=`<section class="panel controls"><div class="row spread"><h2>${room.names[mine.kind]} · 选择一张行动牌</h2><button class="small" id="auto">🤖 让电脑代打一轮</button></div><div class="grid cards">${Array.from({length:8},(_,c)=>{const available=room.legal.some(a=>a.card===c),skill=c>=5?room.skills[mine.kind][c-5]:null;return `<button class="card ${card===c?'selected':''}" data-card="${c}" ${available?'':'disabled'}>${image(c<5?commonArt[c]:mine.kind+'_skill_'+skill[1],'',c<5?names[c]:skill[0])}<strong>${c<5?names[c]:skill[0]}</strong><small>${available?(c===7?'消耗 3 蓄力':'可选择'):c===7&&mine.charge<3?'蓄力不足':mine.lane<0?'先进入兵线':'已使用'}</small></button>`}).join('')}</div><div class="details"><div class="text" id="description"></div><select id="choice" aria-label="行动目标"></select><button class="primary" id="act">锁定并结算</button></div></section>`;}
host.innerHTML=body;if(!room.finished)renderChoice();
}
function renderChoice(){const g=room.game,h=g.heroes[room.player];$('#description').textContent=card<5?room.common[card]:room.skills[h.kind][card-5][2];$('#choice').innerHTML=room.legal.map((a,i)=>{if(a.card!==card)return '';let text=a.card===0?'进军'+laneName(a.lane,room.n):a.buy?'购买 '+manifest.assets.find(x=>x.id===a.buy).name+(h.gear.includes('boots')&&['phase_boots','arcane_boots'].includes(a.buy)?'（鞋子补差价）':''):a.target>=0?'目标：'+actor(a.target):a.card===4?'只整备，不购买':'执行本牌';if(a.card!==0&&a.lane>=0)text='移动到'+laneName(a.lane,room.n)+' · '+text;return `<option value="${i}">${esc(text)}</option>`}).join('');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||busy)return;if(b.dataset.tab){tab=b.dataset.tab;render();}else if(b.dataset.new)api('new',{n:+b.dataset.new});else if(b.dataset.hero)api('hero',{hero:b.dataset.hero});else if(b.dataset.card!==undefined){card=+b.dataset.card;render();}else if(b.id==='start')api('start');else if(b.id==='teams')api('teams',{teams:[...document.querySelectorAll('[data-team]')].map(x=>+x.value)});else if(b.id==='reset'){room=null;render();}else if(b.id==='act')api('act',{choice:+$('#choice').value,round:room.game.round});else if(b.id==='auto')api('auto',{round:room.game.round});});
fetch('assets.json').then(r=>r.json()).then(m=>{manifest=m;render();}).catch(e=>{$('#error').textContent=e.message;$('#error').classList.remove('hidden');});
</script></body></html>
