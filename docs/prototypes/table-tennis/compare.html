<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>乒乓球美术提案</title><style>*{box-sizing:border-box}body{margin:0;padding:38px 44px;background:#eeede7;color:#224339;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;height:62px}h1{font-size:30px;letter-spacing:1px;margin:0 0 8px}p{font-size:13px;color:#58695f;margin:0}.tag{font-size:12px;border:1px solid #b5c3b5;border-radius:22px;padding:8px 15px;align-self:center}.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}.label{font-size:11px;color:#617368;margin-bottom:12px;letter-spacing:1px}.pc img{width:100%;display:block;border-radius:18px;box-shadow:0 14px 36px #223d3014}.phone img{width:100%;display:block;border-radius:22px;border:1px solid #ccd5c7;box-shadow:0 14px 36px #223d3014}footer{display:flex;justify-content:space-between;margin-top:19px;font-size:11px;color:#637265}</style></head><body><header><div><h1 id="title"></h1><p id="description"></p></div><span class="tag">乒乓球 · 第一人称 · 纯球拍双打</span></header><main class="grid"><div class="pc"><div class="label">PC · 第一人称，直接划动挥拍</div><img id="desktop" alt="桌面原型"></div><div class="phone"><div class="label">手机 · 单指挥拍，无人物移动</div><img id="mobile" alt="手机原型"></div></main><footer><span>可运行的 3D 视觉原型 · 画面内抽球 / 削球演示</span><span>概念提案，尚未接入正式比赛规则</span></footer><script>const themes={club:['A · 现代球馆','柔和日光 / 奶油白与鼠尾草绿 / 纯球拍'],arena:['B · 街机赛场','深蓝空间 / 珊瑚色球台 / 聚光与速度感'],heritage:['C · 复古体育馆','高窗日光 / 蜂蜜色木地板 / 传统胶皮球拍']};const t=new URLSearchParams(location.search).get('style')||'club';document.querySelector('#title').textContent=themes[t][0];document.querySelector('#description').textContent=themes[t][1];document.querySelector('#desktop').src='screenshots/rackets-'+t+'-desktop.png';document.querySelector('#mobile').src='screenshots/rackets-'+t+'-mobile.png';</script></body></html>
