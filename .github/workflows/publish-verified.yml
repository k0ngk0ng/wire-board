name: Publish verified build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_run:
        description: Main or legacy tag run with a successful Test and Linux amd64 binary job
        required: true
        type: string
      source_sha:
        description: Full commit SHA built by that run
        required: true
        type: string
      version:
        description: Version to publish, for example v1.8.0
        required: true
        type: string
permissions:
  contents: write
  actions: read
  packages: write
concurrency:
  group: publish-verified-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve the matching verified binary
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const {resolveRelease} = require('./scripts/release-source.cjs');
            const result = await resolveRelease({github, context, inputs: context.payload.inputs || {}, info: core.info});
            for (const [key, value] of Object.entries(result)) core.setOutput(key, value);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wire-board-linux-amd64
          path: verified-build
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
      - name: Validate artifact and prepare unchanged runtime image
        run: |
          cd verified-build
          sha256sum --check SHA256SUMS
          mkdir image
          tar -xzf wire-board-linux-amd64.tar.gz -C image ./wire-board
          test -x image/wire-board
          python3 - <<'PY'
          from pathlib import Path
          source = Path('../Dockerfile').read_text()
          marker = 'FROM alpine:'
          if source.count(marker) != 1:
              raise SystemExit('Expected one Alpine runtime stage')
          runtime = marker + source.split(marker, 1)[1]
          original = 'COPY --from=backend /wire-board /usr/local/bin/wire-board'
          if runtime.count(original) != 1:
              raise SystemExit('Unexpected runtime binary layout')
          Path('image/Dockerfile').write_text(runtime.replace(original, 'COPY wire-board /usr/local/bin/wire-board'))
          PY
      - uses: docker/setup-buildx-action@v3
      - name: Package the verified binary
        uses: docker/build-push-action@v6
        with:
          context: verified-build/image
          platforms: linux/amd64
          load: true
          tags: wire-board-release:verified
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
      - name: Check container startup and backup tool
        run: |
          docker run -d --name release-smoke -e INVITE_CODE=release-smoke-only -p 127.0.0.1:18081:8080 wire-board-release:verified
          trap 'docker rm -f -v release-smoke' EXIT
          for _attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/healthz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:18081/healthz
          docker exec release-smoke sqlite3 --version
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable commit and version tags
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VERSION: ${{ steps.source.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          repo="ghcr.io/${REPOSITORY,,}"
          for tag in "sha-${SOURCE_SHA:0:7}" "$VERSION" latest; do
            docker tag wire-board-release:verified "$repo:$tag"
            docker push "$repo:$tag"
          done
      - name: Publish the matching release and source tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          gh release upload "$VERSION" verified-build/wire-board-linux-amd64.tar.gz verified-build/SHA256SUMS --clobber
          gh release edit "$VERSION" --draft=false --latest
