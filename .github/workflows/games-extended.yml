name: Extended game acceptance
on:
  workflow_dispatch:
    inputs:
      game:
        description: Game to validate with all retained matrices
        required: true
        type: choice
        options:
          - basketball
          - catan
          - starfort
          - yuyuhakusho
permissions:
  contents: read
env:
  PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
  CDN_ORIGIN: ${{ vars.CDN_ORIGIN }}
  OSS_BUCKET: ${{ vars.OSS_BUCKET }}
  OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
  ASSETS_BASE_URL: ${{ vars.ASSETS_BASE_URL }}
  GOCACHE: ${{ github.workspace }}/.local/go-build
  GOMODCACHE: ${{ github.workspace }}/.local/go-mod
  GOTELEMETRY: 'off'
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GAME_ID: ${{ inputs.game }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            scripts/ci/go-cache-version
      - name: Restore game and shared compiler inputs
        uses: ./.github/actions/restore-resources
        with:
          scope: game
          game: ${{ inputs.game }}
      - run: npm --prefix web ci
      - name: Validate retained full matrices
        run: python3 -B scripts/ci/scope.py run --game "$GAME_ID" --backend --extended
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-${{ inputs.game }}-acceptance
          path: |
            .local/ci/${{ inputs.game }}/
            .local/${{ inputs.game }}/verification/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
