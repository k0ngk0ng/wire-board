name: Optional Contra computer research
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
  CDN_ORIGIN: ${{ vars.CDN_ORIGIN }}
  OSS_BUCKET: ${{ vars.OSS_BUCKET }}
  OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
  ASSETS_BASE_URL: ${{ vars.ASSETS_BASE_URL }}
  GOCACHE: ${{ github.workspace }}/.local/go-build
  GOMODCACHE: ${{ github.workspace }}/.local/go-mod
  GOTELEMETRY: 'off'
jobs:
  research:
    name: Experimental Contra computer ${{ matrix.mode }} (${{ matrix.players }} seats; non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON('{"include":[{"mode":"standard-terminal","players":1},{"mode":"standard-terminal","players":2},{"mode":"assisted-clear","players":1},{"mode":"assisted-clear","players":2}]}') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            scripts/ci/go-cache-version
      - name: Restore resources outside Git
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: python3 -B scripts/resource_store.py hydrate --oss --game contra
      - name: Run experimental computer checks without a delivery gate
        env:
          CAMPAIGN_MODE: ${{ matrix.mode }}
          CAMPAIGN_PLAYERS: ${{ matrix.players }}
        run: python3 -B scripts/contra/campaign_modes.py --mode "$CAMPAIGN_MODE" --players "$CAMPAIGN_PLAYERS" --out .local/ci/contra-campaign
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contra-computer-research-${{ matrix.mode }}-${{ matrix.players }}
          path: .local/ci/contra-campaign/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
