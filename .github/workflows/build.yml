name: Test, build and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    name: Go rules and race checks (${{ matrix.shard }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Verify test partition coverage and failure propagation
        run: python3 scripts/test_go_shard_test.py
      - name: Test rules, privacy, persistence and concurrent requests
        run: python3 scripts/test_go_shard.py --index ${{ matrix.shard }} --count 8 --race --timeout 30m
  verify:
    name: Test and Linux amd64 binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build frontend
        run: npm --prefix web ci && npm --prefix web run build
      - name: Test frontend event replay guards
        run: npm --prefix web test
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 1
      - name: Check formatting
        run: test -z "$(gofmt -l main.go main_test.go internal)"
      - name: Vet
        run: go vet ./...
      - name: Validate deployment scripts
        run: bash -n scripts/update.sh && shellcheck scripts/update.sh && python3 scripts/test_update.py
      - name: Build Linux amd64
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist/package
          go build -trimpath -ldflags="-s -w" -o dist/package/wire-board .
          cp README.md .env.example compose.yaml dist/package/
          cp scripts/update.sh dist/package/update.sh
          cp -r docs dist/package/
          tar -C dist/package -czf dist/wire-board-linux-amd64.tar.gz .
          cd dist && sha256sum wire-board-linux-amd64.tar.gz > SHA256SUMS
      - name: Smoke test Linux binary
        env:
          INVITE_CODE: ci-smoke-only
          DATA_DIR: /tmp/wire-board-smoke
          ADDR: 127.0.0.1:18080
        run: |
          dist/package/wire-board &
          pid=$!
          trap 'kill "$pid"' EXIT
          for _attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:18080/healthz
          curl --fail http://127.0.0.1:18080/ | grep 'Wire Board'
      - uses: actions/upload-artifact@v4
        with:
          name: wire-board-linux-amd64
          path: |
            dist/wire-board-linux-amd64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
  image:
    name: Publish Linux amd64 container
    needs: [verify, rules]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published amd64 container
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}@${{ steps.publish.outputs.digest }}
        run: |
          docker run -d --name wire-board-smoke -e INVITE_CODE=ci-smoke-only -p 127.0.0.1:18081:8080 "$IMAGE_REF"
          trap 'docker rm -f wire-board-smoke' EXIT
          for _attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/healthz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:18081/healthz
          curl --fail http://127.0.0.1:18081/ | grep 'Wire Board'
          curl --fail -H 'Content-Type: application/json' --data '{"name":"SmokePlayer","password":"smoke-test-only","invite":"ci-smoke-only"}' http://127.0.0.1:18081/api/register
          docker run --rm --network none --read-only \
            --volumes-from wire-board-smoke:ro --tmpfs /snapshot:rw,size=32m \
            --entrypoint /bin/sh "$IMAGE_REF" -ec '
              sqlite3 -readonly /data/wire-board.db ".backup /snapshot/wire-board.db"
              sqlite3 /snapshot/wire-board.db "PRAGMA journal_mode=DELETE;" >/dev/null
              test "$(sqlite3 -readonly /snapshot/wire-board.db "PRAGMA quick_check;")" = ok
              test "$(sqlite3 -readonly /snapshot/wire-board.db "SELECT count(*) FROM users;")" = 1
            '
          docker restart wire-board-smoke
          for _attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18081/healthz; then break; fi
            sleep 1
          done
          curl --fail -H 'Content-Type: application/json' --data '{"name":"SmokePlayer","password":"smoke-test-only"}' http://127.0.0.1:18081/api/login
  release:
    name: Publish versioned release
    needs: [verify, rules, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wire-board-linux-amd64
          path: release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --title "Wire Board $RELEASE_TAG" --generate-notes
