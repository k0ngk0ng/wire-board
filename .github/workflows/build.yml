name: Check main and build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      game:
        description: 'Optional extra game ID or all for full acceptance; empty selects changed games'
        type: string
        default: ''
      validation:
        description: 'auto selects affected components; quick rejects broad changes; full explicitly checks all games'
        type: choice
        options: [auto, quick, full]
        default: auto
permissions:
  contents: read
  actions: read
env:
  GOCACHE: ${{ github.workspace }}/.local/go-build
  GOMODCACHE: ${{ github.workspace }}/.local/go-mod
  GOTELEMETRY: 'off'
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    name: Select shared and changed-game checks
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      has_games: ${{ steps.scope.outputs.has_games }}
      has_quick: ${{ steps.scope.outputs.has_quick }}
      quick_go: ${{ steps.scope.outputs.quick_go }}
      quick_node_deps: ${{ steps.scope.outputs.quick_node_deps }}
      has_shared: ${{ steps.scope.outputs.has_shared }}
      frontend_checks: ${{ steps.scope.outputs.frontend_checks }}
      build_required: ${{ steps.scope.outputs.build_required }}
      verified_ancestor: ${{ steps.baseline.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find the last verified ancestor
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            const {baseline} = require('./scripts/ci/baseline.cjs');
            const repo = context.repo;
            let publishedSHA = '';
            try {
              const release = (await github.rest.repos.getLatestRelease(repo)).data;
              publishedSHA = (await github.rest.repos.getCommit({...repo, ref:`refs/tags/${release.tag_name}`})).data.sha;
            } catch (error) { if (error.status !== 404) throw error; }
            const api = {
              runs: async function* () {
                for await (const page of github.paginate.iterator(github.rest.actions.listWorkflowRuns, {...repo, workflow_id:'build.yml', branch:'main', event:'push', per_page:100})) {
                  for (const run of page.data) yield run;
                }
              },
              jobs: async run_id => await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...repo, run_id, per_page:100}),
              artifacts: async run_id => await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {...repo, run_id, per_page:100}),
              ancestor: async base => {
                const {data} = await github.rest.repos.compareCommitsWithBasehead({...repo, basehead:`${base}...${context.sha}`});
                return ['ahead','identical'].includes(data.status);
              },
            };
            core.setOutput('sha', await baseline(api, context.runId, publishedSHA) || '');
      - name: Plan changed games, including cancelled predecessor commits
        id: scope
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
          SOURCE_SHA: ${{ github.sha }}
          MANUAL_GAME: ${{ inputs.game }}
          VALIDATION: ${{ inputs.validation || 'auto' }}
        run: |
          args=(plan --base "$BASE_SHA" --head "$SOURCE_SHA" --manual "$MANUAL_GAME" --validation "$VALIDATION")
          python3 -B scripts/ci/scope.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: verification-plan
          path: .local/ci/plan.json
          if-no-files-found: error
          retention-days: 30
  quick:
    name: Fast component checks
    needs: plan
    if: needs.plan.outputs.has_quick == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: needs.plan.outputs.quick_go == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install shared frontend test dependencies
        if: needs.plan.outputs.quick_node_deps == 'true'
        run: npm --prefix web ci
      - uses: actions/download-artifact@v4
        with:
          name: verification-plan
          path: .local/ci
      - name: Run only selected component checks
        run: python3 -B scripts/ci/scope.py run --game quick --plan .local/ci/plan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-component-acceptance
          path: |
            .local/ci/quick/
            .local/ci-lanes/result.json
            .local/ci-scope/git-e2e.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  frontend:
    name: Build application assets
    needs: plan
    if: needs.plan.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v4
        id: media-cache
        with:
          path: .local/verified-game-media/fortressblue/v2
          key: immutable-fortress-media-${{ hashFiles('games/fortressblue/assets/manifest.json') }}
      - name: Find verified immutable media source
        if: steps.media-cache.outputs.cache-hit != 'true'
        id: media-source
        uses: actions/github-script@v7
        env:
          VERIFIED_ANCESTOR: ${{ needs.plan.outputs.verified_ancestor }}
        with:
          script: |
            const sha = process.env.VERIFIED_ANCESTOR;
            if (!/^[a-f0-9]{40}$/.test(sha || '')) return;
            const repo = context.repo;
            const {data} = await github.rest.actions.listWorkflowRuns({...repo, workflow_id:'build.yml', branch:'main', event:'push', head_sha:sha, per_page:100});
            for (const run of data.workflow_runs) {
              if (run.head_sha !== sha || run.head_branch !== 'main' || run.event !== 'push' || run.status !== 'completed' || run.conclusion !== 'success') continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{...repo,run_id:run.id,per_page:100});
              if (artifacts.some(a => a.name === 'web-dist' && !a.expired && a.size_in_bytes > 0)) {
                core.setOutput('run',String(run.id));
                break;
              }
            }
      - name: Restore verified media cache candidate
        if: steps.media-source.outputs.run != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .local/verified-game-media
          run-id: ${{ steps.media-source.outputs.run }}
          github-token: ${{ github.token }}
      - name: Restore verified game media
        run: |
          python3 -B scripts/fortressblue/test_fetch_assets.py
          python3 -B scripts/fortressblue/fetch-assets.py --restore-from .local/verified-game-media
      - name: Check game boundaries and compile application
        env:
          WIRE_BOARD_ASSET_BASE: https://cdn.ichenj.com/bga/web/${{ github.sha }}/
        run: |
          python3 -B scripts/check_game_boundaries.py
          npm --prefix web ci
          npm --prefix web run build
          node scripts/game-loading/check-build.mjs
      - name: Check CDN packaging contracts
        run: |
          node --test web/scripts/cdn-base.test.mjs
          python3 -B scripts/test_cdn_delivery.py
      - name: Verify OSS runtime binding and exclude basketball media
        run: |
          node games/basketball/build/verify-runtime.mjs web/dist
          node games/basketball/build/verify-assets.mjs web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
  shared:
    name: Shared platform HTTP, persistence and race checks
    needs: [plan, frontend]
    if: needs.plan.outputs.has_shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Test shared platform behavior
        run: python3 -B scripts/ci/scope.py run --game shared
      - name: Check formatting and static correctness
        run: |
          test -z "$(gofmt -l main.go main_test.go internal games)"
          go vet ./...
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-platform-acceptance
          path: .local/ci/shared/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  games:
    name: Game ${{ matrix.game }}
    needs: [plan, frontend]
    if: needs.plan.outputs.has_games == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Install dependencies for game rendering checks
        if: (matrix.game == 'battlecity' || matrix.game == 'conquest' || matrix.game == 'tabletennis' || matrix.game == 'contra')
        run: npm --prefix web ci
      - name: Prepare PvZ asset verification environment
        if: matrix.game == 'pvz'
        run: |
          set -o pipefail
          mkdir -p .local/tmp .local/pvz/ci-assets
          export TMPDIR="$PWD/.local/tmp"
          export PIP_CACHE_DIR="$PWD/.local/pvz/ci-assets/pip-cache"
          export PIP_DISABLE_PIP_VERSION_CHECK=1
          python3 -B -c 'import json; from pathlib import Path; Path(".local/pvz/ci-assets/prepare-result.json").write_text(json.dumps({"passed":False,"phase":"dependency-setup"})+"\n")'
          python3 -m venv .local/pvz/ci-assets/venv
          .local/pvz/ci-assets/venv/bin/python -m pip install Pillow==13.0.0 2>&1 | tee .local/pvz/ci-assets/install.log
          if ! command -v ffmpeg >/dev/null 2>&1; then
            .local/pvz/ci-assets/venv/bin/python -m pip install imageio-ffmpeg==0.6.0 2>&1 | tee -a .local/pvz/ci-assets/install.log
          fi
          .local/pvz/ci-assets/venv/bin/python -B scripts/ci/scope.py pvz-tools
      - name: Validate this game only
        env:
          GAME_ID: ${{ matrix.game }}
          BACKEND_CHANGED: ${{ matrix.backend }}
        run: |
          args=(--game "$GAME_ID")
          if [ "$BACKEND_CHANGED" = true ]; then args+=(--backend); fi
          if [ "$GAME_ID" = pvz ]; then
            export PATH="$PWD/.local/pvz/ci-assets/bin:$PWD/.local/pvz/ci-assets/venv/bin:$PATH"
            export TMPDIR="$PWD/.local/tmp"
            export PIP_CACHE_DIR="$PWD/.local/pvz/ci-assets/pip-cache"
          fi
          python3 -B scripts/ci/scope.py run "${args[@]}"
      - name: Verify changed Contra native and browser binding
        if: matrix.game == 'contra' && matrix.backend
        run: |
          python3 -B games/contra/build/ci_runtime.py --dist web/dist --out .local/contra-game-runtime
          python3 -B scripts/contra/accept_production.py --runtime .local/contra-game-runtime/manifest.json --out .local/ci/contra-binding
      - name: Remove temporary PvZ asset tools
        if: always() && matrix.game == 'pvz'
        run: rm -rf .local/pvz/ci-assets/bin .local/pvz/ci-assets/venv .local/pvz/ci-assets/pip-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-${{ matrix.game }}-acceptance
          path: |
            .local/ci/${{ matrix.game }}/
            .local/ci/contra-binding/result.json
            .local/pvz/ci-assets/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  verify:
    name: Test and Linux amd64 binary
    needs: [plan, quick, frontend, shared, games]
    if: >-
      always() && !cancelled() &&
      needs.plan.result == 'success' && needs.plan.outputs.build_required == 'true' &&
      needs.frontend.result == 'success' &&
      (needs.quick.result == 'success' || needs.quick.result == 'skipped') &&
      (needs.shared.result == 'success' || needs.shared.result == 'skipped') &&
      (needs.games.result == 'success' || needs.games.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/download-artifact@v4
        with:
          name: verification-plan
          path: .local/ci
      - name: Preserve source-bound runtime metadata before CDN trimming
        run: |
          python3 -B games/contra/build/ci_runtime.py --dist web/dist --out .local/contra-ci-runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-runtime-binding
          path: |
            .local/contra-ci-runtime/ci-origin.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Upload immutable frontend modules without CDN readback
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: python3 -B scripts/cdn_delivery.py upload --report .local/cdn-delivery/uploaded.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdn-assets-upload
          path: .local/cdn-delivery/uploaded.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Keep application modules off the server package
        run: python3 -B scripts/cdn_delivery.py trim --report .local/cdn-delivery/uploaded.json
      - name: Build Linux amd64 after every required check passed
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist/package
          python3 -B games/contra/build/native.py --runtime .local/contra-ci-runtime/manifest.json --out dist/package/wire-board --goos linux --goarch amd64
          test -s dist/package/wire-board.build.json
          python3 -B scripts/cdn_delivery.py check-package --binary dist/package/wire-board --report .local/cdn-delivery/uploaded.json
          cp .local/ci/plan.json dist/package/verification-plan.json
          cp README.md .env.example compose.yaml dist/package/
          cp scripts/update.sh dist/package/update.sh
          mkdir -p dist/package/docs
          cp docs/deployment.md docs/admin.md docs/THIRD_PARTY.md dist/package/docs/
          tar -C dist/package -czf dist/wire-board-linux-amd64.tar.gz .
          cd dist && sha256sum wire-board-linux-amd64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-package-boundary
          path: .local/cdn-delivery/server-package.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
      - name: Smoke test Linux binary
        env:
          INVITE_CODE: ci-smoke-only
          DATA_DIR: ${{ github.workspace }}/.local/smoke-data
          ADDR: 127.0.0.1:18080
        run: |
          dist/package/wire-board &
          pid=$!
          trap 'kill "$pid"' EXIT
          for _attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:18080/healthz
          curl --fail http://127.0.0.1:18080/ | grep 'Wire Board'
      - uses: actions/upload-artifact@v4
        with:
          name: wire-board-linux-amd64
          retention-days: 30
          path: |
            dist/wire-board-linux-amd64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
  complete:
    name: Selected checks passed
    needs: [plan, quick, frontend, shared, games, verify]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected lane to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json,os
          jobs=json.loads(os.environ['RESULTS'])
          assert jobs['plan']['result']=='success',jobs
          flags=jobs['plan']['outputs']
          required={'quick':'has_quick','frontend':'build_required','shared':'has_shared','games':'has_games','verify':'build_required'}
          for job,flag in required.items():
              result=jobs[job]['result']
              assert result=='success' if flags[flag]=='true' else result in ('success','skipped'),(job,result,flags)
          print('Every selected check passed; unselected lanes were skipped.')
          PY
