name: Extended Catan acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
  CDN_ORIGIN: ${{ vars.CDN_ORIGIN }}
  OSS_BUCKET: ${{ vars.OSS_BUCKET }}
  OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
  ASSETS_BASE_URL: ${{ vars.ASSETS_BASE_URL }}
  GOCACHE: ${{ github.workspace }}/.local/go-build
  GOMODCACHE: ${{ github.workspace }}/.local/go-mod
  GOTELEMETRY: 'off'
jobs:
  catan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            scripts/ci/go-cache-version
      - name: Restore Catan and shared compiler inputs
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: python3 -B scripts/resource_store.py hydrate --oss --game catan
      - run: npm --prefix web ci
      - name: Validate all Catan rules and combinations
        run: python3 -B scripts/ci/scope.py run --game catan --backend --catan-extended
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catan-extended-acceptance
          path: .local/ci/catan/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
